# Pylon Daily: refresh player stats every morning from nflverse.
# Runs tools/build_data.py, and commits data.json only when the numbers changed.
# Cloudflare Pages redeploys the site automatically after each commit.
name: Update player data

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC (6:17 a.m. Eastern in winter)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build data.json from nflverse
        run: python tools/build_data.py
      - name: Commit if the numbers changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No new stats today."
            exit 0
          fi
          git config user.name "pylon-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update player data: $(python -c 'import json;print(json.load(open("data.json"))["note"])')"
          git push
